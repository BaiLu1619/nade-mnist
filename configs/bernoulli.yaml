# Bernoulli NADE uses MNIST.
data_dir: data
dataset: mnist

# Data preprocessing
representation: binary
binarization: fixed
threshold: 0.5
validation_size: 10000

# Model
hidden_dim: 128
init_std: 0.01

# Training
epochs: 20
batch_size: 128
learning_rate: 0.001
grad_clip: 5.0

# Runtime and output
seed: 42
num_workers: 0
num_samples: 64
